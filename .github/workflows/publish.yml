name: Publish GeoLab and APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build complete GeoLab site
        run: python build_site.py
      - name: Test all OX question explanations and answer consistency
        run: node tests/ox-explain.test.cjs
      - name: Test teacher-reviewed Korean OX additions
        run: node tests/ox-teacher-approved.test.cjs
      - name: Test Köppen classification and station search
        run: node tests/climate.test.cjs
      - name: Test separated energy statistics
        run: node tests/stats.test.cjs
      - name: Test exam-focused geography statistics
        run: node tests/study-stats.test.cjs
      - name: Test nationwide city and county boundary learning
        run: node tests/regions.test.cjs
      - name: Test advanced map categories and schematic railway study
        run: node tests/advanced.test.cjs
      - name: Verify world geography industrial and conflict region explorer
        run: node tests/world-regions.test.cjs
      - name: Audit complete source statistics and official UN migration cross-checks
        run: node tests/stats-integrity.test.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: GeoLab-site
          path: site
          retention-days: 7
      - name: Try enabling Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/$GITHUB_REPOSITORY/pages" -f build_type=workflow || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    needs: website
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK command line tools
        run: |
          set -e
          export ANDROID_HOME="$HOME/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
          curl -fsSL --retry 3 -o /tmp/cmdline.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline.zip -d /tmp/android-unpack
          mv /tmp/android-unpack/cmdline-tools/* "$ANDROID_HOME/cmdline-tools/latest/"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build Android APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug
      - name: Copy APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk GeoLab.apk
      - uses: actions/upload-artifact@v4
        with:
          name: GeoLab-APK
          path: GeoLab.apk
          retention-days: 90
      - name: Publish Android release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-$GITHUB_RUN_NUMBER" GeoLab.apk --title "GeoLab Android $GITHUB_RUN_NUMBER" --notes "Android install package (test signature)" || true
