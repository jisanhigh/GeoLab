name: Probe GeoLab recovery sources
on:
  push:
    paths:
      - '.github/workflows/recovery-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check accessible historical and hosted files
        run: |
          python - <<'PY'
          from urllib.request import Request,urlopen
          from urllib.error import HTTPError
          targets=[
            "https://jisanhigh.github.io/GeoLab/",
            "https://jisanhigh.github.io/GeoLab/index.html",
            "https://jisanhigh.github.io/GeoLab/app.js",
            "https://jisanhigh.github.io/GeoLab/tools/ox/data/ox.json",
            "https://jisanhigh.github.io/GeoLab/tools/ox/data/ox-extra.json",
            "https://jisanhigh.github.io/GeoLab/ds/codec.js",
            "https://jisanhigh.github.io/GeoLab/tools/stats/data/stats.json",
            "https://jisanhigh.github.io/GeoLab/tools/climate/index.html",
            "https://twotimeessgeo.github.io/country-map-maker/tools/ox/data/ox.json",
            "https://codeload.github.com/twotimeessgeo/country-map-maker/zip/refs/heads/main",
            "https://api.github.com/repos/twotimeessgeo/country-map-maker",
          ]
          for u in targets:
            try:
              with urlopen(Request(u,headers={'User-Agent':'GeoLab-Recovery/1.0'}),timeout=20) as f:
                sample=f.read(512)
                print('URL',u,'STATUS',f.status,'TYPE',f.headers.get('content-type'),'BYTES HEADER',f.headers.get('content-length'),'SAMPLE',repr(sample[:120]),flush=True)
            except Exception as e:
              print('URL',u,'FAILED',str(e),flush=True)
          PY
      - name: Inspect legacy catalog and inventory counts
        run: |
          python - <<'PY'
          import json,urllib.request,re
          base="https://jisanhigh.github.io/GeoLab/"
          for p in ["INVENTORY.json","catalog.json","tools/cut/data/ebsi_geo_data.json","manifest.webmanifest","tools/ox/data/ox.json"]:
            try:
              with urllib.request.urlopen(base+p,timeout=25) as f: raw=f.read()
              data=json.loads(raw)
              print('FILE',p,'BYTES',len(raw),'TYPE',type(data).__name__,flush=True)
              if p=="INVENTORY.json":print('INVENTORY',str(data)[:2000])
              elif p=="catalog.json":
                print('CATALOG COUNT',len(data),'SAMPLE',str(data[:4])[:900])
                print('CATALOG URL SAMPLE', [x.get("url") for x in data[:10]])
              elif p.startswith("tools/cut/"):
                print('EXAM ROOT KEYS',list(data)[:20], 'sample',str(data)[:500])
              elif p.endswith('ox.json'):print('OX ROOT KEYS',list(data)[:20])
            except Exception as e:print('ERR',p,str(e)[:300])
          PY
      - name: Inspect historical image and audio URL conventions
        run: |
          python - <<'PY'
          import urllib.request,re,pathlib
          base="https://jisanhigh.github.io/GeoLab/"
          names=["ds/codec.js","tools/cut/data/ebsi_geo_data.json",
          "tools/ox/data/ox.json","tools/ox/data/ox-extra.json",
          "tools/cut/index.html","tools/ox/index.html","tools/climate/index.html"]
          for n in names:
            try:
              with urllib.request.urlopen(base+n,timeout=25) as f:b=f.read()
              out=pathlib.Path('/tmp')/n;out.parent.mkdir(parents=True,exist_ok=True);out.write_bytes(b)
              text=b.decode('utf8',errors='replace')
              print("FETCH",n,len(b))
              for pat in ("question-images","audio/","png","mp3","images/","data/"):
                i=text.find(pat)
                if i>=0:print("NEAR",pat,repr(text[max(0,i-150):i+230]))
            except Exception as ex:print("FETCH FAILED",n,str(ex))
          PY
          node <<'JS'
          const fs=require('fs'),vm=require('vm'),context={};
          vm.createContext(context);
          vm.runInContext(fs.readFileSync('/tmp/ds/codec.js','utf8'),context);
          for (const file of ['ebsi_geo_data.json','ox.json','ox-extra.json']) {
            const fn=file.startsWith('ebsi')?'/tmp/tools/cut/data/'+file:'/tmp/tools/ox/data/'+file;
            let data=context.TwCodec.unwrap(JSON.parse(fs.readFileSync(fn,'utf8')));
            console.log('UNPACKED',file,JSON.stringify(Object.keys(data)),JSON.stringify(data).length);
            let sample=JSON.stringify(data);
            for (let pat of ['question-images','/audio/','.png','.webp','.mp3','.jpg']) {
              let at=sample.indexOf(pat);
              console.log('MATCH',file,pat,at,at<0?'':sample.slice(Math.max(0,at-110),at+170));
            }
            console.log('HEAD DATA',file,sample.slice(0,850));
          }
          JS
      - name: Extract script paths and image naming logic
        run: |
          python - <<'PY'
          import urllib.request,re
          base="https://jisanhigh.github.io/GeoLab/"
          for p in ["tools/cut/index.html","tools/ox/index.html","tools/climate/index.html","tools/stats/index.html","tools/cut/data/ebsi_geo_data.json"]:
            with urllib.request.urlopen(base+p,timeout=30) as u:s=u.read().decode("utf8",errors="replace")
            if p.endswith('.json'):
              import json
              obj=json.loads(s)
              print("PACK KEYS",list(obj))
              continue
            print("PAGE",p,"SCRIPTS",re.findall(r'<script[^>]+src=["\']([^"\']+)',s,flags=re.I))
            print("PAGE",p,"LINKS",re.findall(r'<link[^>]+href=["\']([^"\']+)',s,flags=re.I)[:30])
            print("PAGE",p,"IMAGES",re.findall(r'(?:src|href)=["\']([^"\']+\.(?:png|jpg|svg|webp|mp3|mp4))',s,flags=re.I)[:20])
          PY
          node <<'JS'
          const fs=require('fs'),vm=require('vm'),context={};vm.createContext(context);vm.runInContext(fs.readFileSync('/tmp/ds/codec.js','utf8'),context);
          let d=context.TwCodec.unwrap(JSON.parse(fs.readFileSync('/tmp/tools/cut/data/ebsi_geo_data.json','utf8')));
          console.log("RECORD COUNT",d.records?.length,"SAMPLE",JSON.stringify(d.records?.slice(0,3)).slice(0,2200));
          JS
