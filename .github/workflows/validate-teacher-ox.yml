name: Verify approved Korean OX questions
on:
  push:
    branches: [main]
    paths:
      - 'app/ox-teacher-approved-2026-korea.js'
      - 'app/app.js'
      - 'app/index.html'
      - 'tests/ox-teacher-approved.test.cjs'
      - '.github/workflows/validate-teacher-ox.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ox-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate 41 non-excluded teacher-reviewed Korean geography OX questions
        run: node tests/ox-teacher-approved.test.cjs
      - name: Check JavaScript syntax
        run: |
          node --check app/app.js
          node --check app/ox-teacher-approved-2026-korea.js
